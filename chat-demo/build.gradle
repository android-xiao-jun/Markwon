apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

// ============ 从 local.properties 读取 AI 模型连接配置 ============
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def aiBaseUrl = localProperties.getProperty('ai.baseUrl', '')
def aiApiKey = localProperties.getProperty('ai.apiKey', '')
def aiModel = localProperties.getProperty('ai.model', '')

android {
    compileSdkVersion config['compile-sdk']
    buildToolsVersion config['build-tools']

    defaultConfig {
        applicationId 'io.noties.markwon.chatdemo'
        // markwon 库全局 minSdk 16；chat-demo 为独立 demo App，
        // 因引入 codelocator（minSdk 19）等调试依赖提升至 19
        minSdkVersion 19
        targetSdkVersion config['target-sdk']
        versionCode 1
        versionName '1.0'

        multiDexEnabled true

        // AI 模型连接配置（来自 local.properties，key: ai.baseUrl / ai.apiKey / ai.model）
        buildConfigField 'String', 'AI_BASE_URL', "\"$aiBaseUrl\""
        buildConfigField 'String', 'AI_API_KEY', "\"$aiApiKey\""
        buildConfigField 'String', 'AI_MODEL', "\"$aiModel\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

// kapt 官方开关：stub 中无法解析的类型从生成源推断，
// 避免 Room @Database 等注解被占位成 @error.NonExistentClass 导致编译失败
kapt {
    correctErrorTypes = true
}

dependencies {
    implementation deps['x-appcompat']
    implementation deps['x-core']
    implementation deps['x-recycler-view']
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.multidex:multidex:2.0.1'
    // 侧滑会话抽屉 + ViewModel（appcompat 不保证传递依赖，显式声明）
    implementation 'androidx.drawerlayout:drawerlayout:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.2.0'

    //调试
    // 注：codelocator 2.0.4 在荣耀 API27 测试机上安装报 Failure[-200]（INSTALL_FAILED_INVALID_APK），
    // 已验证与其注入内容相关，暂时注释恢复安装；如需启用请自行排查该库与设备的兼容性
     debugImplementation "com.bytedance.tools.codelocator:codelocator-core:2.0.4"

    // ============ Room 数据库（本地消息 + 会话历史） ============
    // 2.3.0 修复 2.2.x + Kotlin 1.4 下 kapt 解析 @Database 注解报 NonExistentClass 的问题
    implementation 'androidx.room:room-runtime:2.3.0'
    kapt 'androidx.room:room-compiler:2.3.0'

    // ============ 网络：OkHttp 直连 DeepSeek（流式 SSE） ============
    implementation deps['okhttp']
    implementation deps['gson']

    // ============ 协程 ============
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2'

    // ============ markwon：AI 回复 Markdown 渲染（整段 + 流式增量） ============
    implementation project(':markwon-core')
    implementation project(':markwon-block')
    implementation project(':markwon-ext-strikethrough')
    implementation project(':markwon-ext-tables')
    implementation project(':markwon-ext-tasklist')
    implementation project(':markwon-image')
    implementation project(':markwon-html')
}