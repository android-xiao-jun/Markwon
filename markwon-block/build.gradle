plugins {
    id 'com.android.library'
}
apply from: rootProject.file('gradle/maven-publish.gradle')

android {
    compileSdkVersion config['compile-sdk']
    buildToolsVersion config['build-tools']

    // 块渲染类使用 lambda / 接口静态方法，需 Java 8
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    defaultConfig {
        minSdkVersion config['min-sdk']
        targetSdkVersion config['target-sdk']
        versionCode 1
        versionName version
    }
}

dependencies {
    // 块渲染依赖 core（解析/渲染管线）与 ext-tables（表格）
    api project(':markwon-core')
    api project(':markwon-ext-tables')
    // 图片加载默认走 markwon-image（ImageBlockView 的 AsyncDrawableLoader 默认实现；
    // markwon-image-glide 由使用方可选引入，把 loader 传入块视图即可）
    api project(':markwon-image')

    deps.with {
        implementation it['x-annotations']
    }
}
